<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { width: 380px; font-family: system-ui, -apple-system, sans-serif; background: #16161d; color: #f0f0f5; margin: 0; padding: 0; }
    header { background: #1f1f29; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d3a; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: #ff5722; }
    .tabs { display: flex; background: #1f1f29; border-bottom: 1px solid #2d2d3a; }
    .tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: 600; color: #999; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #ff5722; border-bottom-color: #ff5722; }
    .container { padding: 12px; max-height: 400px; overflow-y: auto; }
    .search-bar { display: flex; gap: 6px; margin-bottom: 10px; }
    .search-bar input { flex: 1; background: #242430; border: 1px solid #353545; color: #fff; padding: 7px 10px; border-radius: 6px; font-size: 12px; outline: none; }
    .search-bar input:focus { border-color: #ff5722; }
    .btn-clear { background: #2d2d3a; color: #ccc; border: none; padding: 7px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    .btn-clear:hover { background: #e53935; color: #fff; }
    .track { background: #22222e; border: 1px solid #2d2d3c; padding: 10px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .info { overflow: hidden; flex: 1; }
    .title { font-weight: 600; font-size: 12px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; margin-bottom: 3px; }
    .meta { color: #888; font-size: 10px; }
    .actions { display: flex; gap: 5px; }
    .btn-icon { background: #2f2f3f; color: #ddd; border: none; padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 11px; }
    .btn-icon:hover { background: #404055; }
    .btn-dl { background: #ff5722; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 11px; }
    .btn-dl:hover { background: #e64a19; }
    .empty { color: #777; font-size: 12px; text-align: center; padding: 30px 10px; line-height: 1.5; }
    .setting-group { margin-bottom: 14px; }
    .setting-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #ccc; }
    .setting-group select, .setting-group input { width: 100%; background: #242430; border: 1px solid #353545; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 12px; }
    .hint { font-size: 11px; color: #777; margin-top: 4px; }
    .save-status { color: #4caf50; font-size: 11px; display: none; margin-top: 8px; text-align: center; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="brand">🎵 OK.ru Downloader Pro</div>
    <span style="font-size: 11px; color: #777;">v3.0</span>
  </header>

  <div class="tabs">
    <div class="tab active" id="tabTracks">Yakalananlar (<span id="count">0</span>)</div>
    <div class="tab" id="tabSettings">⚙ Ayarlar</div>
  </div>

  <!-- Yakalanan Müzikler Sekmesi -->
  <div class="container" id="viewTracks">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Şarkı veya sanatçı ara...">
      <button id="clearBtn" class="btn-clear" title="Geçmişi Temizle">Temizle</button>
    </div>
    <div id="list"></div>
  </div>

  <!-- Ayarlar Sekmesi -->
  <div class="container" id="viewSettings" style="display: none;">
    <div class="setting-group">
      <label>Dosya İsimlendirme Formatı</label>
      <select id="nameFormat">
        <option value="artist_title">Sanatçı - Şarkı Adı.mp3</option>
        <option value="title_artist">Şarkı Adı - Sanatçı.mp3</option>
        <option value="title_only">Sadece Şarkı Adı.mp3</option>
      </select>
    </div>

    <div class="setting-group">
      <label>İndirme Alt Klasörü</label>
      <input type="text" id="subFolder" placeholder="Örn: OK_Music (Boş bırakılabilir)">
      <div class="hint">Tarayıcının İndirilenler klasörü içinde bu isimle klasör açar.</div>
    </div>

    <div class="save-status" id="saveStatus">✔ Ayarlar otomatik kaydedildi</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
